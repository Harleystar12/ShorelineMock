<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Blue Light Card holders receive an extra 10% off all orders at Shoreline Bathrooms. Cannot be used with other offers." />
    <title>Special Offers | Shoreline Bathrooms</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/offers.css" />
</head>
<body>
    <div id="header"></div>
    <main>
        <section class="offer-section" aria-labelledby="offer-title">
            <div class="offer-art" role="img" aria-label="Blue Light Card offer illustration"></div>
            <div class="offer-copy"><h1 id="offer-title">BLUE LIGHT CARD</h1><p>Extra 10% off all orders for Blue Light Card Holders!</p><p>(cannot be used in conjunction with any other offers)</p></div>
        </section>
    </main>
    <div id="footer"></div>
    <script>
        const designDropdowns = [...document.querySelectorAll('.nav-list details')];
        const closeDesignDropdowns = () => designDropdowns.forEach((dropdown) => { dropdown.open = false; });
        document.addEventListener('click', (event) => {
            if (!event.target.closest('.nav-list details')) closeDesignDropdowns();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeDesignDropdowns();
        });
        window.addEventListener('wheel', closeDesignDropdowns, { passive: true });
        let touchStartY = 0;
        let touchStartedOutsideDropdown = false;
        document.addEventListener('touchstart', (event) => {
            touchStartY = event.changedTouches[0].clientY;
            touchStartedOutsideDropdown = !event.target.closest('.nav-list details');
        }, { passive: true });
        document.addEventListener('touchend', (event) => {
            const touchEndY = event.changedTouches[0].clientY;
            if (touchStartedOutsideDropdown && Math.abs(touchEndY - touchStartY) > 35) closeDesignDropdowns();
        }, { passive: true });
        designDropdowns.forEach((dropdown) => {
            dropdown.querySelectorAll('.dropdown a').forEach((link) => link.addEventListener('click', closeDesignDropdowns));
        });
    </script>
    <script src="/js/layout.js"></script>
    <script src="/js/contact-form.js"></script>
    <script src="/js/navigation.js"></script>
</body>
</html>
