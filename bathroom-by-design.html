<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Explore bathroom products by category at Shoreline Bathrooms in Great Yarmouth." />
    <title>Bathroom by Design | Shoreline Bathrooms</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/design.css" />
</head>
<body>
    <div id="header"></div>
    <main class="design-main">
        <div class="container">
            <header class="page-heading"><p class="eyebrow">Make it yours</p><h1>Bathroom by Design</h1><p>Browse the details, finishes and fixtures that bring a bathroom together. Choose a category to explore our showroom selections.</p></header>
            <nav class="filter-bar" aria-label="Filter bathroom products" id="category-filters"></nav>
            <p class="results-count" id="results-count" role="status" aria-live="polite"></p>
            <section class="design-gallery" id="design-gallery" aria-label="Bathroom products gallery"></section>
        </div>
    </main>
    <dialog class="viewer" aria-label="Bathroom product image viewer">
        <div class="viewer-bar"><p class="viewer-caption" id="viewer-caption"></p><button class="viewer-close" type="button" aria-label="Close image viewer" autofocus>&times;</button></div>
        <div class="viewer-stage"><button class="viewer-arrow" type="button" data-viewer-step="-1" aria-label="Previous image">&#8249;</button><img class="viewer-image" src="" alt="" /><button class="viewer-arrow" type="button" data-viewer-step="1" aria-label="Next image">&#8250;</button></div>
    </dialog>
    <div id="footer"></div>
    <script>
        const categories = [
            { id: 'showers', name: 'Showers', prefix: 'Shower', count: 4 },
            { id: 'toilets', name: 'Toilets', prefix: 'Toilet', count: 4 },
            { id: 'baths', name: 'Baths', prefix: 'Bath', count: 4 },
            { id: 'furniture', name: 'Furniture', prefix: 'Furniture', count: 4 },
            { id: 'tiles-flooring', name: 'Tiles & Flooring', prefix: 'Tiles', count: 4 },
            { id: 'wall-panels', name: 'Wall Panels', prefix: 'Panels', count: 3 },
            { id: 'towels-radiators', name: 'Towel Rails & Radiators', prefix: 'TowelsAndRadiator', count: 4 },
            { id: 'basins', name: 'Basins', prefix: 'Basin', count: 4 },
            { id: 'taps', name: 'Taps', prefix: 'Taps', count: 4 },
            { id: 'mirrors', name: 'Mirrors & Cabinets', prefix: 'Mirror', count: 4 },
            { id: 'accessories', name: 'Accessories', prefix: 'accessories', count: 4 },
            { id: 'ventilation-lighting', name: 'Ventilation & Lighting', prefix: 'VentsAndLight', count: 3 }
        ];
        const products = categories.flatMap((category) =>
            Array.from({ length: category.count }, (_, index) => ({
                category: category.id,
                name: category.name,
                image: `Images/${category.prefix}${index + 1}.jpg`,
                number: index + 1
            }))
        );
        const filterBar = document.querySelector('#category-filters');
        const gallery = document.querySelector('#design-gallery');
        const resultsCount = document.querySelector('#results-count');
        const viewer = document.querySelector('.viewer');
        const viewerImage = viewer.querySelector('.viewer-image');
        const viewerCaption = viewer.querySelector('.viewer-caption');
        let activeFilter = 'all';
        let activeProductIndex = 0;
        let visibleProductIndices = products.map((_, index) => index);

        const filterOptions = [{ id: 'all', name: 'All categories' }, ...categories];
        filterOptions.forEach((category) => {
            const button = document.createElement('button');
            button.className = 'filter-button';
            button.type = 'button';
            button.dataset.category = category.id;
            button.setAttribute('aria-pressed', 'false');
            button.textContent = category.name;
            button.addEventListener('click', () => setFilter(category.id));
            filterBar.append(button);
        });

        const productButtons = products.map((product, productIndex) => {
            const figure = document.createElement('figure');
            figure.className = 'design-card';
            figure.dataset.category = product.category;
            const button = document.createElement('button');
            button.className = 'design-open';
            button.type = 'button';
            button.setAttribute('aria-label', `View ${product.name.toLowerCase()} display ${product.number}`);
            const frame = document.createElement('span');
            frame.className = 'design-image';
            const image = document.createElement('img');
            image.src = product.image;
            image.alt = `${product.name} showroom display ${product.number}`;
            image.loading = 'lazy';
            frame.append(image);
            button.append(frame);
            const caption = document.createElement('figcaption');
            caption.className = 'design-caption';
            caption.innerHTML = `<span>${product.name}</span><small>Display ${product.number}</small>`;
            figure.append(button, caption);
            button.addEventListener('click', () => {
                activeProductIndex = productIndex;
                showProduct(productIndex);
                viewer.showModal();
            });
            gallery.append(figure);
            return { figure, button };
        });

        function setFilter(categoryId) {
            activeFilter = categoryId;
            let visibleCount = 0;
            visibleProductIndices = [];
            productButtons.forEach(({ figure }, index) => {
                const matches = categoryId === 'all' || figure.dataset.category === categoryId;
                figure.hidden = !matches;
                if (matches) {
                    visibleCount += 1;
                    visibleProductIndices.push(index);
                }
            });
            filterBar.querySelectorAll('.filter-button').forEach((button) => {
                button.setAttribute('aria-pressed', String(button.dataset.category === categoryId));
            });
            const categoryName = filterOptions.find((option) => option.id === categoryId)?.name ?? 'All categories';
            resultsCount.textContent = categoryId === 'all'
                ? `Showing all ${visibleCount} displays`
                : `Showing ${visibleCount} ${categoryName.toLowerCase()} displays`;
            if (!visibleProductIndices.includes(activeProductIndex)) activeProductIndex = visibleProductIndices[0];
            const url = new URL(window.location.href);
            if (categoryId === 'all') url.searchParams.delete('category');
            else url.searchParams.set('category', categoryId);
            window.history.replaceState({}, '', url);
        }

        function showProduct(index) {
            const visibleIndex = visibleProductIndices.indexOf(index);
            const nextVisibleIndex = (visibleIndex + visibleProductIndices.length) % visibleProductIndices.length;
            activeProductIndex = visibleProductIndices[nextVisibleIndex];
            const product = products[activeProductIndex];
            viewerImage.src = product.image;
            viewerImage.alt = `${product.name} showroom display ${product.number}`;
            viewerCaption.textContent = `${product.name} · display ${product.number}`;
        }

        filterBar.addEventListener('click', (event) => {
            if (event.target.closest('.filter-button')) gallery.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        viewer.querySelector('.viewer-close').addEventListener('click', () => viewer.close());
        viewer.querySelectorAll('[data-viewer-step]').forEach((button) => {
            button.addEventListener('click', () => {
                const visibleIndex = visibleProductIndices.indexOf(activeProductIndex);
                const nextVisibleIndex = (visibleIndex + Number(button.dataset.viewerStep) + visibleProductIndices.length) % visibleProductIndices.length;
                showProduct(visibleProductIndices[nextVisibleIndex]);
            });
        });
        viewer.addEventListener('click', (event) => {
            if (event.target === viewer) viewer.close();
        });
        viewer.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowLeft') viewer.querySelector('[data-viewer-step="-1"]').click();
            if (event.key === 'ArrowRight') viewer.querySelector('[data-viewer-step="1"]').click();
        });
        const requestedCategory = new URLSearchParams(window.location.search).get('category');
        setFilter(filterOptions.some((option) => option.id === requestedCategory) ? requestedCategory : 'all');

        const designDropdowns = [...document.querySelectorAll('.nav-list details')];
        const closeDesignDropdowns = () => designDropdowns.forEach((dropdown) => { dropdown.open = false; });
        document.addEventListener('click', (event) => {
            if (!event.target.closest('.nav-list details')) closeDesignDropdowns();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeDesignDropdowns();
        });
        window.addEventListener('wheel', closeDesignDropdowns, { passive: true });
        designDropdowns.forEach((dropdown) => {
            dropdown.querySelectorAll('.dropdown a').forEach((link) => link.addEventListener('click', closeDesignDropdowns));
        });
    </script>
    <script src="/js/layout.js"></script>
    <script src="/js/contact-form.js"></script>
    <script src="/js/navigation.js"></script>
</body>
</html>
